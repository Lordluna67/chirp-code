<!DOCTYPE html>
<html lang="en">
<!-- CHIRP REMOTE APP SHELL: update this file on GitHub for app-layout changes. -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chirp — a community chat app." />
  <meta name="chirp-shell-version" content="2" />
  <title>Chirp</title>
  <style id="chirp-bootstrap-style">
    html,body{margin:0;min-height:100%;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}
    #chirp-boot-screen{position:fixed;inset:0;z-index:999999;background:#000;color:#f4f6f8;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px;font:14px/1.5 Arial,Helvetica,sans-serif;opacity:1;visibility:visible}
    #chirp-boot-screen.is-exiting{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility .55s ease}
    .chirp-stream-svg{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}
    .chirp-stream-path{fill:none;stroke:#4B91F5;stroke-width:12;stroke-linecap:round;filter:none}
    .chirp-loading-container{position:relative;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .chirp-logo-container{position:relative;width:230px;height:230px}
    .chirp-liquid-logo{position:absolute;inset:0;opacity:0;overflow:hidden;-webkit-mask-image:url("https://cdn.jsdelivr.net/gh/Lordluna67/chirp-code@main/assets/chirp-logo.png");mask-image:url("https://cdn.jsdelivr.net/gh/Lordluna67/chirp-code@main/assets/chirp-logo.png");-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mask-mode:alpha}
    .chirp-liquid-fill{position:absolute;width:190%;height:180%;left:-45%;bottom:-140%;background:#4B91F5;border-radius:45%;transform:rotate(-8deg)}
    .chirp-liquid-fill::before{content:"";position:absolute;width:160%;height:45px;top:-25px;left:-30%;background:#4B91F5;border-radius:50%}
    .chirp-liquid-logo.fill{opacity:1}
    .chirp-liquid-logo.fill .chirp-liquid-fill{animation:chirpLiquidFlow 1.5s cubic-bezier(.2,.8,.3,1) forwards}
    @keyframes chirpLiquidFlow{0%{bottom:-140%;transform:rotate(-10deg) scaleX(.7)}25%{bottom:-90%;transform:rotate(6deg) scaleX(1.1)}50%{bottom:-50%;transform:rotate(-4deg) scaleX(.95)}75%{bottom:-15%;transform:rotate(3deg) scaleX(1.04)}100%{bottom:0;transform:rotate(0) scaleX(1)}}
    .chirp-liquid-logo.disappear{animation:chirpLiquidDisappear 1.4s ease-in-out forwards}
    @keyframes chirpLiquidDisappear{0%,35%{opacity:1}70%{opacity:.45}100%{opacity:0}}
    .chirp-splash-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.01);filter:none}
    .chirp-splash-logo.show{animation:chirpLogoAppear 1.4s ease-in-out forwards}
    @keyframes chirpLogoAppear{0%{opacity:0;transform:scale(1.01)}25%{opacity:.15}55%{opacity:.55}80%{opacity:.9}100%{opacity:1;transform:scale(1)}}
    .chirp-splash-title{margin-top:25px;font-size:90px;font-weight:700;letter-spacing:12px;color:#4B91F5;opacity:0;animation:chirpTextAppear .6s ease-out forwards}
    @keyframes chirpTextAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    #chirp-boot-status{position:fixed;left:16px;right:16px;bottom:53px;margin:0;text-align:center;color:#777;font-size:12px;letter-spacing:.04em;z-index:10}
    #chirp-boot-error{position:fixed;left:18px;right:18px;bottom:86px;max-height:22vh;overflow:auto;color:#ffabab;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:11px;display:none;z-index:11}
    #chirp-boot-retry{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:#4B91F5;color:#07101e;border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;display:none;z-index:12}
    .chirp-copyright{position:fixed;bottom:21px;left:50%;transform:translateX(-50%);color:#4B91F5;font-size:12px;letter-spacing:1px;white-space:nowrap;opacity:0;z-index:10}
    .chirp-copyright.show{animation:chirpCopyrightAppear .5s ease forwards}
    @keyframes chirpCopyrightAppear{from{opacity:0}to{opacity:1}}
    @media(max-width:600px){.chirp-logo-container{width:180px;height:180px}.chirp-splash-title{font-size:50px;letter-spacing:7px}.chirp-copyright{font-size:10px;bottom:18px}#chirp-boot-status{font-size:11px;bottom:44px}}
    @media(prefers-reduced-motion:reduce){.chirp-splash-title{animation:none;opacity:1}.chirp-stream-svg{display:none}}
  </style>
  <script>
    window.CHIRP_ASSET_BASE = "https://cdn.jsdelivr.net/gh/Lordluna67/chirp-code@main/assets/";
  </script>
</head>
<body>
  <div id="chirp-boot-screen" role="status" aria-live="polite">
    <svg class="chirp-stream-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <path id="chirp-flight-path" class="chirp-stream-path" d="M 2100 120 C 1800 -120, 1400 0, 1120 230 C 850 450, 1450 510, 1570 720 C 1680 950, 1100 1100, 680 830 C 420 660, 480 350, 960 500" />
    </svg>
    <div class="chirp-loading-container">
      <div class="chirp-logo-container">
        <div id="chirp-liquid-logo" class="chirp-liquid-logo"><div class="chirp-liquid-fill"></div></div>
        <img id="chirp-splash-logo" class="chirp-splash-logo" alt="Chirp logo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
      </div>
      <div id="chirp-splash-title" class="chirp-splash-title">CHIRP</div>
    </div>
    <p id="chirp-boot-status">Loading the latest Chirp app…</p>
    <div id="chirp-boot-error"></div>
    <button id="chirp-boot-retry" type="button">Try again</button>
    <div id="chirp-copyright" class="chirp-copyright">© 2026 Chirp. All rights reserved.</div>
  </div>
  <main class="wrap" id="auth-view">
    <div class="box">
      <img class="login-logo" data-chirp-logo alt="Chirp bird logo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" style="display:block;width:210px;height:auto;max-width:75vw;object-fit:contain;margin:0 auto 18px;" />
      <h1>CHIRP</h1>
      <p class="hint">Welcome to Chirp! Log in or sign up.</p>
      <div class="tabs">
        <button type="button" id="tab-login" class="active">Log in</button>
        <button type="button" id="tab-signup">Sign up</button>
      </div>
      <div id="login-view">
        <div id="login-error" class="msg bad"></div>
        <div id="login-success" class="msg good"></div>
        <form id="login-form">
          <label>Username <input name="username" type="text" placeholder="username" required /></label>
          <label>Password <input name="password" type="password" placeholder="password" required /></label>
          <div class="row">
            <label><input type="checkbox" name="remember" /> Always Sign Back In</label>
            <a href="#forgot" id="forgot">Forgot?</a>
          </div>
          <button class="submit" type="submit">Log in</button>
        </form>
      </div>
      <div id="signup-view" class="hidden">
        <div id="signup-error" class="msg bad"></div>
        <div id="signup-success" class="msg good"></div>
        <form id="signup-form">
          <label>Display name <input name="name" type="text" placeholder="Your name" required /></label>
          <label>Username <input name="username" type="text" placeholder="username" required /></label>
          <label>Password <input name="password" type="password" placeholder="At least 8 characters" required /></label>
          <label>Confirm password <input name="confirm" type="password" placeholder="Type it again" required /></label>
          <button class="submit" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </main>

  <div id="chat-view" class="hidden">
    <div id="sidebar">
      <div style="padding: 0 16px 12px; font-weight: 700;">Channels</div>
      <div id="channels">
        <div class="channel" data-channel="profile">Profile</div>
        <div class="channel active" data-channel="general"># general</div>
        <div class="channel admin-only hidden" data-channel="moderation"># moderation</div>
      </div>
      <button type="button" id="add-channel-btn" style="margin: 8px 12px; padding: 8px; background: #222; color: #eee; border: 1px solid #333; border-radius: 6px; cursor: pointer;">Add channel</button>
      <div id="online-users">
        <h3>Online</h3>
        <div id="user-list"></div>
      </div>
      <div id="sidebar-account" aria-label="Your account">
        <div id="sidebar-account-row">
          <button type="button" id="sidebar-account-name" class="username-link">Account</button>
          <span id="sidebar-account-badges" aria-label="Your badges"></span>
        </div>
        <div id="sidebar-account-caption">Signed in</div>
      </div>
    </div>
    <div id="main-chat">
      <div id="chat-header">
        <h1 id="current-channel"># general</h1>
        <div id="chat-header-actions">
          <button id="clear-general-btn" type="button" class="hidden" style="margin-right: 2px; background: #e74c3c; color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer;">Clear general</button>
          <button id="notifications-btn" type="button" aria-expanded="false" aria-controls="notification-center" title="Notifications">🔔 <span class="notification-button-label">Notifications</span><span id="notification-count" aria-label="Unread notifications">0</span></button>
          <span id="user-info"></span>
          <button id="logout-btn">Log out</button>
        </div>
      </div>
      <section id="notification-center" class="hidden" aria-label="Notification center">
        <div id="notification-center-header"><strong>Notifications</strong><div class="notification-header-actions"><button id="mark-notifications-read" type="button">Mark all read</button><button id="close-notifications" type="button" aria-label="Close notifications">✕</button></div></div>
        <div id="notification-list"><div class="notification-empty">You're all caught up.</div></div>
      </section>
      <div id="messages"></div>
      <div id="moderation-panel"></div>
      <section id="profile-panel" aria-live="polite"></section>
      <form id="message-form">
        <div id="reply-preview" class="hidden" aria-live="polite">
          <span>Replying to <strong id="reply-preview-user"></strong></span>
          <span id="reply-preview-text"></span>
          <button id="cancel-reply" type="button" aria-label="Cancel reply">×</button>
        </div>
        <div id="message-compose-row">
          <input id="message-input" type="text" placeholder="Type a message… use @username to ping" maxlength="500" required />
          <button id="send-btn" type="submit">Send</button>
        </div>
      </form>
    </div>
  </div>
  <div id="ping-toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-database-compat.js"></script>

  <script>
    (async function loadLatestChirpAssets() {
      const boot = document.getElementById("chirp-boot-screen");
      const status = document.getElementById("chirp-boot-status");
      const errorBox = document.getElementById("chirp-boot-error");
      const retry = document.getElementById("chirp-boot-retry");
      const flightPath = document.getElementById("chirp-flight-path");
      const liquidLogo = document.getElementById("chirp-liquid-logo");
      const splashLogo = document.getElementById("chirp-splash-logo");
      const copyright = document.getElementById("chirp-copyright");
      const repo = "Lordluna67/chirp-code";
      const timestamp = () => Date.now().toString();
      window.CHIRP_ASSET_BASE = "https://cdn.jsdelivr.net/gh/" + repo + "@main/assets/";
      let splashAnimationFinished = false;
      let appReady = false;
      let startupFailed = false;

      function finishStartupIfReady() {
        if (!splashAnimationFinished || !appReady || startupFailed || !boot) return;
        boot.classList.add("is-exiting");
        setTimeout(() => boot.remove(), 600);
      }

      function startSplashAnimation() {
        if (!flightPath || !liquidLogo) {
          splashAnimationFinished = true;
          finishStartupIfReady();
          return;
        }
        try {
          const length = flightPath.getTotalLength();
          flightPath.style.strokeDasharray = `0 ${length}`;
          let progress = 0;
          const speed = 0.006;
          function animateStream() {
            progress = Math.min(1, progress + speed);
            const currentDistance = progress * length;
            const trailLength = 280 + Math.sin(progress * Math.PI * 5) * 70;
            const startDistance = Math.max(0, currentDistance - trailLength);
            const visibleLength = currentDistance - startDistance;
            flightPath.style.strokeDasharray = `${visibleLength} ${length}`;
            flightPath.style.strokeDashoffset = -startDistance;
            if (progress < 1) {
              requestAnimationFrame(animateStream);
              return;
            }
            flightPath.style.opacity = "0";
            liquidLogo.classList.add("fill", "disappear");
            if (splashLogo) splashLogo.classList.add("show");
            setTimeout(() => {
              if (copyright) copyright.classList.add("show");
              splashAnimationFinished = true;
              finishStartupIfReady();
            }, 2200);
          }
          setTimeout(animateStream, 350);
        } catch (err) {
          console.warn("Chirp splash animation could not run:", err);
          splashAnimationFinished = true;
          finishStartupIfReady();
        }
      }

      startSplashAnimation();

      function showFailure(message, details) {
        startupFailed = true;
        if (status) status.textContent = message;
        if (errorBox) {
          errorBox.style.display = "block";
          errorBox.textContent = details || "Check your internet connection and the public GitHub repository, then try again.";
        }
        if (retry) {
          retry.style.display = "inline-block";
          retry.onclick = () => window.location.reload();
        }
      }

      async function fetchRemoteText(file, minimumLength) {
        const urls = [
          "https://raw.githubusercontent.com/" + repo + "/main/" + file + "?fresh=" + timestamp(),
          "https://cdn.jsdelivr.net/gh/" + repo + "@main/" + file + "?fresh=" + timestamp()
        ];
        const errors = [];
        for (const url of urls) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            let response, content;
            try {
              response = await fetch(url, { cache: "no-store", mode: "cors", signal: controller.signal });
              if (!response.ok) throw new Error("HTTP " + response.status);
              content = await response.text();
            } finally {
              clearTimeout(timeoutId);
            }
            if (content.trim().length < minimumLength) throw new Error("The downloaded file is empty or incomplete.");
            if (/^\s*<!doctype html/i.test(content) && file !== "chirp-app.html") throw new Error("The server returned an HTML error page instead of " + file + ".");
            return content;
          } catch (err) {
            errors.push(url + " — " + (err && err.message ? err.message : String(err)));
            console.warn("Chirp could not load", file, "from", url, err);
          }
        }
        throw new Error(errors.join("\n"));
      }

      try {
        if (!window.firebase || typeof firebase.initializeApp !== "function" || typeof firebase.database !== "function") {
          throw new Error("Firebase's browser libraries did not load. Check your connection and reload.");
        }
        if (status) status.textContent = "Loading latest Chirp styles…";
        const cssText = await fetchRemoteText("chirp.css", 1000);
        const style = document.createElement("style");
        style.id = "chirp-remote-css";
        style.textContent = cssText;
        document.head.appendChild(style);

        const logoUrl = window.CHIRP_ASSET_BASE + "chirp-logo.png?fresh=" + timestamp();
        const logo = document.querySelector("[data-chirp-logo]");
        if (logo) logo.src = logoUrl;
        if (splashLogo) splashLogo.src = logoUrl;

        if (status) status.textContent = "Loading latest Chirp features…";
        const jsText = await fetchRemoteText("chirp.js", 10000);
        const script = document.createElement("script");
        const objectUrl = URL.createObjectURL(new Blob([jsText], { type: "text/javascript" }));
        script.src = objectUrl;
        script.onload = () => {
          URL.revokeObjectURL(objectUrl);
          document.documentElement.dataset.chirpRemoteCode = "loaded";
          appReady = true;
          if (status) status.textContent = "Chirp is ready";
          finishStartupIfReady();
          console.info("Chirp loaded from the public GitHub repository.");
        };
        script.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          showFailure("Chirp downloaded its JavaScript but the browser could not run it.", "Check the JavaScript file in GitHub and the Firefox Web Console for details.");
        };
        document.body.appendChild(script);
      } catch (err) {
        console.error("Chirp startup failed:", err);
        showFailure("Chirp could not finish starting.", (err && err.message ? err.message : String(err)) + "\n\nCheck the internet connection and GitHub repository, then click Try again.");
      }
    })();
  </script>
</body>
</html>
